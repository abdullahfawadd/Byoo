name: byoo
services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: byoo
      POSTGRES_USER: byoo
      POSTGRES_PASSWORD: byoo_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - byoo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byoo -d byoo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - byoo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  byoo-postgres:
  byoo-redis:
