[project]
name = "byoo-pooling-ai"
version = "1.0.0"
description = "Islamabad pool viability simulation, training, and advisory service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "joblib>=1.4,<2",
  "numpy>=2.1,<2.4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<1.8",
  "uvicorn>=0.34,<1",
  "xgboost==3.1.3; sys_platform != 'linux'",
  "xgboost-cpu==3.1.3; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
